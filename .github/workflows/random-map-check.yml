name: Random Map Device Build
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Mac build pool (archive only; never run the app)
        type: choice
        default: macos-15-intel
        options: [macos-15-intel, macos-15]
  push:
    branches: [fix/build33-face-grounding-camera]
permissions:
  contents: read
concurrency:
  group: random-map-${{ github.ref }}-${{ inputs.runner || 'macos-15-intel' }}
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            Sources
            Vendor
            scripts
            Tests
            UITests
            MeadowJourney.xcodeproj
      - name: Validate and test pure rules and generation
        run: |
          set -euo pipefail
          mkdir -p build
          python3 scripts/validate-project.py
          swift test --package-path Vendor/ClassroomGameCore 2>&1 | tee build/map-tests.log
          bash scripts/check-road-motion.sh
          bash scripts/check-battle-encounter.sh
          bash scripts/check-battle-effects.sh
          bash scripts/check-modular-locomotion.sh
          swift run --package-path Vendor/ClassroomGameCore MeadowSupportReviewExport build/monster-review --monster-only
          swift run --package-path Vendor/ClassroomGameCore MeadowMapExport 10 31827 1 --encounters > build/encounters-default.json
          swift run --package-path Vendor/ClassroomGameCore MeadowMapExport 30 18446744073709551615 1 --encounters > build/encounters-max.json
          swift run --package-path Vendor/ClassroomGameCore MeadowMapExport 10 31827 1 --balance > build/balance-default.json
          swift run --package-path Vendor/ClassroomGameCore MeadowMapExport 30 18446744073709551615 1 --balance > build/balance-max.json
          swift run --package-path Vendor/ClassroomGameCore MeadowMapExport 10 31827 1 --guidance > build/guidance-default.json
          swift run --package-path Vendor/ClassroomGameCore MeadowMapExport 30 18446744073709551615 1 --guidance > build/guidance-max.json
          swift run --package-path Vendor/ClassroomGameCore MeadowMapExport 10 31827 1 --equipment > build/equipment-default.json
          swift run --package-path Vendor/ClassroomGameCore MeadowMapExport 30 18446744073709551615 1 --equipment > build/equipment-max.json
      - name: Audit complete journeys using pure rules only
        run: |
          set -euo pipefail
          swift run -c release --package-path Vendor/ClassroomGameCore MeadowCampaignReview --matrix > build/journey-audit.json 2> build/journey-audit.log
          swift run -c release --package-path Vendor/ClassroomGameCore MeadowCampaignReview --loadout-smoke > build/loadout-smoke.json 2> build/loadout-smoke.log
      - name: Archive without running application or simulator
        run: |
          set -euo pipefail
          xcodebuild archive -project MeadowJourney.xcodeproj -scheme MeadowJourney \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/MeadowJourney.xcarchive -derivedDataPath build/Derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee build/archive.log
          bash scripts/package-ipa.sh build/MeadowJourney.xcarchive build/MeadowJourney-b90.ipa
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: random-map-build-${{ github.run_id }}
          path: |
            build/*.log
            build/*.ipa
            build/encounters-*.json
            build/balance-*.json
            build/guidance-*.json
            build/equipment-*.json
            build/loadout-smoke.json
            build/journey-audit.json
            build/monster-review/*.json
          if-no-files-found: error
          retention-days: 30
