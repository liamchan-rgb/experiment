name: iOS Build and Visual Demo

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Xcode compile, test and unsigned IPA
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      PROJECT: MeadowJourney.xcodeproj
      SCHEME: MeadowJourney

    steps:
      - uses: actions/checkout@v7

      - name: Inspect Xcode and the checked-in project
        run: |
          set -euo pipefail
          mkdir -p build/logs
          xcode-select -p 2>&1 | tee build/logs/xcode-path.log
          xcodebuild -version 2>&1 | tee build/logs/xcode-version.log
          xcodebuild -list -project "$PROJECT" 2>&1 | tee build/logs/project.log
          python3 scripts/validate-project.py

      - name: Compile Swift for iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/SimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/logs/simulator-build.log

      - name: Choose an installed compatible iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list --json > build/logs/simulator-inventory.json
          if python3 scripts/select-simulator.py > build/simulator-udid.txt; then
            :
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            xcodebuild -downloadPlatform iOS 2>&1 | tee build/logs/runtime-download.log
            python3 scripts/select-simulator.py > build/simulator-udid.txt
          fi
          simulator_udid="$(cat build/simulator-udid.txt)"
          echo "udid=$simulator_udid" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$simulator_udid" -b \
            2>&1 | tee build/logs/simulator-boot.log

      - name: Run route logic and UI tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath build/SimulatorDerivedData \
            -resultBundlePath build/TestResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/logs/tests.log

      - name: Export visual screenshots
        if: ${{ always() && steps.simulator.outcome == 'success' }}
        run: |
          set -euo pipefail
          if [ -d build/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path build/TestResults.xcresult --output-path build/screenshots \
              2>&1 | tee build/logs/screenshot-export.log
          fi

      - name: Archive for physical iPhone and iPad without signing
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MeadowJourney.xcarchive \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build/logs/device-archive.log
          bash scripts/package-ipa.sh \
            build/MeadowJourney.xcarchive build/MeadowJourney-unsigned.ipa \
            2>&1 | tee build/logs/package-ipa.log

      - name: Upload build logs even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: xcode-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload test results and visual screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-visual-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/screenshots/
            build/TestResults.xcresult/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload SideStore re-signable unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: MeadowJourney-unsigned-IPA
          path: build/MeadowJourney-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

