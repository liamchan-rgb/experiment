name: iOS Build and Visual Demo

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Xcode compile, test and unsigned IPA
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      PROJECT: MeadowJourney.xcodeproj
      SCHEME: MeadowJourney

    steps:
      - uses: actions/checkout@v7

      - name: Inspect Xcode and the checked-in project
        run: |
          set -euo pipefail
          mkdir -p build/logs
          xcode-select -p 2>&1 | tee build/logs/xcode-path.log
          xcodebuild -version 2>&1 | tee build/logs/xcode-version.log
          xcodebuild -list -project "$PROJECT" 2>&1 | tee build/logs/project.log
          python3 scripts/validate-project.py

      - name: Compile Swift for iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/SimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/logs/simulator-build.log

      - name: Choose an installed compatible iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list --json > build/logs/simulator-inventory.json
          if python3 scripts/select-simulator.py > build/simulator-udid.txt; then
            :
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            xcodebuild -downloadPlatform iOS 2>&1 | tee build/logs/runtime-download.log
            python3 scripts/select-simulator.py > build/simulator-udid.txt
          fi
          simulator_udid="$(cat build/simulator-udid.txt)"
          echo "udid=$simulator_udid" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$simulator_udid" -b \
            2>&1 | tee build/logs/simulator-boot.log
          python3 scripts/select-simulator.py iPad > build/ipad-udid.txt
          ipad_udid="$(cat build/ipad-udid.txt)"
          echo "ipad_udid=$ipad_udid" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$ipad_udid" -b \
            2>&1 | tee build/logs/ipad-boot.log

      - name: Run route logic and UI tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath build/SimulatorDerivedData \
            -resultBundlePath build/TestResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/logs/tests.log

      - name: Verify the iPad layout and ordered journey
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.ipad_udid }}' \
            -only-testing:MeadowJourneyUITests \
            -derivedDataPath build/SimulatorDerivedData \
            -resultBundlePath build/iPadResults.xcresult \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/logs/ipad-tests.log

      - name: Export visual screenshots
        if: ${{ always() && steps.simulator.outcome == 'success' }}
        run: |
          set -euo pipefail
          if [ -d build/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path build/TestResults.xcresult --output-path build/screenshots \
              2>&1 | tee build/logs/screenshot-export.log
          fi
          if [ -d build/iPadResults.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path build/iPadResults.xcresult --output-path build/ipad-screenshots \
              2>&1 | tee build/logs/ipad-screenshot-export.log
          fi

      - name: Record a native-resolution iPad dynamic scene
        run: |
          set -euo pipefail
          mkdir -p build/visual-review
          ipad_udid='${{ steps.simulator.outputs.ipad_udid }}'
          xcrun simctl terminate "$ipad_udid" com.liamchan.experiment.meadow || true
          xcrun simctl io "$ipad_udid" recordVideo --codec=h264 \
            build/visual-review/iPad-LivingScene.mp4 > build/logs/video.log 2>&1 &
          recorder_pid=$!
          trap 'kill -INT "$recorder_pid" 2>/dev/null || true' EXIT
          xcrun simctl launch "$ipad_udid" com.liamchan.experiment.meadow -visualDemo -visualReview
          sleep 18
          xcrun simctl io "$ipad_udid" screenshot build/visual-review/iPad-LivingScene-native.png
          kill -INT "$recorder_pid"
          wait "$recorder_pid" || true
          trap - EXIT
          data_path="$(xcrun simctl get_app_container "$ipad_udid" com.liamchan.experiment.meadow data)"
          cp "$data_path/Documents/RuntimeMetrics.json" build/visual-review/RuntimeMetrics.json
          python3 scripts/summarize-metrics.py build/visual-review/RuntimeMetrics.json \
            2>&1 | tee build/logs/runtime-metrics.log

      - name: Record four-direction gait and a stationary atmosphere view
        run: |
          set -euo pipefail
          ipad_udid='${{ steps.simulator.outputs.ipad_udid }}'
          record_review() {
            local clip_name="$1"
            local clip_seconds="$2"
            shift 2
            xcrun simctl terminate "$ipad_udid" com.liamchan.experiment.meadow || true
            xcrun simctl launch "$ipad_udid" com.liamchan.experiment.meadow "$@"
            sleep 1
            xcrun simctl io "$ipad_udid" recordVideo --codec=h264 \
              "build/visual-review/$clip_name.mp4" > "build/logs/$clip_name.log" 2>&1 &
            local recorder_pid=$!
            trap 'kill -INT "$recorder_pid" 2>/dev/null || true' EXIT
            xcrun simctl io "$ipad_udid" screenshot "build/visual-review/$clip_name-start.png"
            sleep "$clip_seconds"
            xcrun simctl io "$ipad_udid" screenshot "build/visual-review/$clip_name-end.png"
            kill -INT "$recorder_pid"
            wait "$recorder_pid" || true
            trap - EXIT
          }
          record_review iPad-FourDirectionGait 12 -gaitReview
          record_review iPad-Atmosphere 12 -visualReview

      - name: Archive for physical iPhone and iPad without signing
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MeadowJourney.xcarchive \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build/logs/device-archive.log
          bash scripts/package-ipa.sh \
            build/MeadowJourney.xcarchive build/MeadowJourney-unsigned.ipa \
            2>&1 | tee build/logs/package-ipa.log

      - name: Upload build logs even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: xcode-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload test results and visual screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-visual-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/screenshots/
            build/ipad-screenshots/
            build/visual-review/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload complete Xcode test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/TestResults.xcresult/
            build/iPadResults.xcresult/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload SideStore re-signable unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: MeadowJourney-unsigned-IPA
          path: build/MeadowJourney-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

