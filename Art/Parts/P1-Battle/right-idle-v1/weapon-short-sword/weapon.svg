<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" shape-rendering="crispEdges">
  <title>Right-facing side idle short sword candidate</title>
  <desc>Independent pixel-geometric short sword on the registered 256 by 256 P1 battle-side canvas. Transparent everywhere except sword pixels.</desc>
  <!-- Blade: narrow, tapered steel, extending up-right from the guard. -->
  <g id="weapon.blade">
    <path fill="#302a29" d="M151 157 L189 140 L194 142 L157 163 Z"/>
    <path fill="#687078" d="M153 157 L189 141 L193 142 L157 160 Z"/>
    <path fill="#dce3e4" d="M154 157 L188 142 L191 142 L157 159 Z"/>
    <path fill="#f4f2e8" d="M157 156 L188 142 L190 142 L159 157 Z"/>
