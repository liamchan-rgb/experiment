  <g id="weapon.guard">
    <path fill="#493018" d="M147 153 L150 151 L158 165 L155 168 Z"/>
    <path fill="#a86f2d" d="M148 153 L150 152 L157 165 L155 166 Z"/>
    <path fill="#e4b65c" d="M149 153 L150 153 L156 164 L155 164 Z"/>
    <path fill="#70471f" d="M147 153 L150 151 L151 153 L149 155 Z"/>
