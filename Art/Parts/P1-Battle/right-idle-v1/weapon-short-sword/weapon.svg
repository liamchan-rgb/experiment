  <g id="weapon.grip">
    <path fill="#34251e" d="M136 167 L149 159 L153 160 L140 169 Z"/>
    <path fill="#68452d" d="M137 166 L149 159 L152 160 L140 168 Z"/>
    <path fill="#91643d" d="M139 166 L149 160 L151 160 L141 167 Z"/>
    <path fill="#3a2c25" d="M138 164 L140 163 L143 168 L141 169 Z"/>
    <path fill="#3a2c25" d="M142 162 L144 161 L147 166 L145 167 Z"/>
    <path fill="#3a2c25" d="M146 160 L148 159 L151 164 L149 165 Z"/>
    <path fill="#af824c" d="M139 165 L140 164 L141 165 L140 166 Z"/>
