<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>P1 侧视待机 · 中性人体候选</title>
<style>
* { box-sizing:border-box; }
html,body { margin:0; width:1024px; height:1024px; background:#e3dfd3; }
body { font-family:system-ui,sans-serif; color:#303e34; }
header { position:absolute; left:56px; top:38px; }
h1 { margin:0 0 12px; font-size:30px; }

footer { position:absolute; left:56px; right:56px; bottom:45px; font-size:20px; line-height:1.8; }

#hand-detail img { position:absolute; width:3072px; height:3072px; max-width:none; left:-1584px; top:-1800px; image-rendering:pixelated; }

.export #hand-detail,.export #zoom-title { display:none; }
.export,.export body { width:256px; height:256px; background:transparent; }

</style>
<header><h1>侧视待机 · 中性人体 r2</h1><p>向右朝向 · 近侧右手拇指与指节方向修订</p></header>

<script>
const s=129/705, tx=128-643*s, ty=85-370*s;
const image=document.getElementById('source');
if(new URLSearchParams(location.search).has('export')) {
 document.documentElement.classList.add('export');
 image.style.left=tx+'px'; image.style.top=ty+'px'; image.style.transform='scale('+s+')';
} else {
 image.src='00.png'; image.style.width='256px'; image.style.height='256px';
 image.style.left='0'; image.style.top='0'; image.style.transform='none';
}
window.poseReady=Promise.all([image.decode(), ...(new URLSearchParams(location.search).has('export')?[]:[document.getElementById('zoom-image').decode()])]);
