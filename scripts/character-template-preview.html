<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P1 人物工坊 · 向下换装小样</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10191e;color:#e7ece7;font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #b8e1c9;outline-offset:3px}button{color:inherit;border:1px solid #3a4a50;background:#203037;border-radius:9px;padding:9px 14px;transition:background .12s}button:hover{background:#2c4148}button[aria-pressed=true]{background:#37554b;border-color:#9cceac;color:#e9f7df}button:disabled{opacity:.4;cursor:wait}select{color:#e7ece7;background:#203037;border:1px solid #465b62;border-radius:8px;padding:8px}main{max-width:1240px;margin:0 auto;padding:35px 32px}.eyebrow{font-size:11px;letter-spacing:3px;color:#94b7a2}.masthead{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}h1{font-size:29px;letter-spacing:1px;font-weight:600;margin:4px 0}p{margin:5px 0;color:#a7bac0}.status{font-size:12px;border:1px solid #3b554b;border-radius:20px;padding:7px 13px;white-space:nowrap;color:#b7d5b9}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px}.stage{border:1px solid #334248;border-radius:16px;overflow:hidden;background:#162329}.stage-top{padding:13px 19px;border-bottom:1px solid #334248;display:flex;justify-content:space-between;font-size:12px;color:#b9c8cc}.views{display:grid;grid-template-columns:1fr 1fr}.view{position:relative;min-width:0}.view+.view{border-left:1px solid #334248}.view-label{position:absolute;top:18px;left:18px;color:#a9bec5;font-size:12px;z-index:1}.view-label b{display:block;color:#e7ece7;font-size:15px;font-weight:500}.sprite{display:block;width:100%;height:auto;background:radial-gradient(ellipse at 50% 60%,#263b40 0%,#162329 70%);image-rendering:pixelated}.controls{padding:15px 18px;border-top:1px solid #334248;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.primary{background:#bed5a7;color:#182719;border-color:#bed5a7;min-width:84px}.primary:hover{background:#d3e6c1}.frame-label{font-variant-numeric:tabular-nums;color:#b9cbd0;font-size:12px;margin-left:auto}.timeline{padding:0 18px 17px;display:flex;gap:7px}.timeline button{flex:1;padding:6px 0;font-size:12px;font-variant-numeric:tabular-nums}.customizer{background:#18252a;border:1px solid #334248;border-radius:16px;padding:22px}.customizer h2{font-size:18px;margin:0 0 3px;font-weight:550}.hint{font-size:12px;color:#91a7af}.group{border:0;padding:0;margin:23px 0 0;min-width:0}.group legend{font-size:12px;color:#b6c7cb;margin-bottom:9px}.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.options button{text-align:left;padding:9px 10px;font-size:13px}.swatch{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;border:1px solid #ffffff30}.export{margin-top:27px;border-top:1px solid #334248;padding-top:17px;display:flex;gap:8px;flex-wrap:wrap}.export button{font-size:12px;padding:7px 9px}.footer{margin-top:20px;display:flex;gap:15px;align-items:flex-start;justify-content:space-between}.footer p{font-size:12px;max-width:750px}.footer a{color:#b6d3a4;text-decoration:none;white-space:nowrap;font-size:12px}.check{display:flex;gap:6px;align-items:center;font-size:12px;color:#afc4ca;cursor:pointer}.layer-panel{margin-top:14px;border-top:1px solid #334248;padding-top:12px}summary{font-size:12px;color:#afc4ca;cursor:pointer}.layer-list{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.loading{font-size:12px;color:#d9be86;margin-top:10px}input{accent-color:#b9d6a6}.note{border-left:2px solid #677e6e;padding-left:10px;margin-top:14px;font-size:12px;color:#a4b8bd}@media(max-width:900px){main{padding:22px 16px}.workspace{grid-template-columns:1fr}.customizer{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.customizer h2,.customizer>.hint,.export,.layer-panel,.note{grid-column:1/-1}.masthead{align-items:flex-start}.status{white-space:normal;font-size:11px;max-width:130px}.footer{flex-direction:column}}@media(prefers-reduced-motion:reduce){*{transition:none}}
</style>
<style>@media(max-width:600px){.view-label{position:static;padding:12px 12px 0;min-height:66px;font-size:11px}.view-label b{font-size:13px}}</style>
<main>
 <header class="masthead"><div><div class="eyebrow">CHARACTER ATELIER / P1</div><h1>人物工坊</h1><p>同一套步态，换一种角色。</p></div><span class="status">向下动作基准已锁定<br>换装小样 · 待审核</span></header>
 <div class="workspace">
  <section class="stage" aria-label="动画对照">
   <div class="stage-top"><span>向下 ↓ · 站姿 + 8 帧行走</span><span>同步对照</span></div>
   <div class="views"><div class="view"><div class="view-label"><b>已认可原动作</b>作为比例和步态参照</div><canvas id="reference" class="sprite" width="420" height="540" aria-label="已认可原动作预览"></canvas></div><div class="view"><div class="view-label"><b>你的角色</b><span id="look-name">栗发旅人</span></div><canvas id="character" class="sprite" width="420" height="540" aria-label="换装角色预览"></canvas></div></div>
   <div class="controls"><button id="play" class="primary" disabled>暂停</button><select id="speed" aria-label="播放速度"><option value="120">正常速度</option><option value="480">四分之一速度</option></select><label class="check"><input type="checkbox" id="anchors">查看挂点</label><span id="frame-label" class="frame-label">01 / 08</span></div>
   <div id="timeline" class="timeline" role="group" aria-label="逐帧检查"></div>
  </section>
  <aside class="customizer" aria-label="角色外观设置"><h2>自定义外观</h2><div class="hint">16 种组合，动作保持一致</div>
   <fieldset class="group"><legend>头发</legend><div class="options" data-slot="hair"><button data-value="chestnut" aria-pressed="true"><i class="swatch" style="background:#a96032"></i>栗色碎发</button><button data-value="silver" aria-pressed="false"><i class="swatch" style="background:#dbe1e7"></i>银色短发</button></div></fieldset>
   <fieldset class="group"><legend>面部</legend><div class="options" data-slot="face"><button data-value="blue" aria-pressed="true"><i class="swatch" style="background:#568ef2"></i>蓝眼平静</button><button data-value="amber" aria-pressed="false"><i class="swatch" style="background:#e8ae42"></i>金眼微笑</button></div></fieldset>
   <fieldset class="group"><legend>衣物</legend><div class="options" data-slot="outfit"><button data-value="traveler" aria-pressed="true"><i class="swatch" style="background:#256be4"></i>蓝色旅装</button><button data-value="ranger" aria-pressed="false"><i class="swatch" style="background:#548567"></i>绿色游侠</button></div></fieldset>
   <fieldset class="group"><legend>角色右手</legend><div class="options" data-slot="weapon"><button data-value="empty" aria-pressed="true">空手</button><button data-value="sword" aria-pressed="false">短剑</button></div></fieldset>
   <div class="export"><button id="export-atlas" disabled>导出动作图集</button><button id="export-frame" disabled>导出当前帧</button><button id="export-config" disabled>保存搭配</button></div>
   <details class="layer-panel"><summary>查看分层</summary><div class="layer-list" id="layer-list"></div></details>
   <div class="note">换装时重点看头部比例、袖口遮挡和剑柄位置。点击帧号可暂停检查；00 是站姿。</div><div id="loading" class="loading" role="status">正在加载部件…</div>
  </aside>
 </div>
 <footer class="footer"><p>本轮只检查向下方向。衣物沿用这套短外套的袖型与下摆；大体积盔甲、长裙和其他方向需要单独适配。</p><a href="README.md">源文件与使用说明 ↗</a></footer>
</main>
<script id="template-data" type="application/json">/*__TEMPLATE_DATA__*/</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('template-data').textContent), m=data.manifest;
const state={selection:{hair:'chestnut',face:'blue',outfit:'traveler',weapon:'empty'},frame:1,playing:!matchMedia('(prefers-reduced-motion: reduce)').matches,frameMs:120,anchors:false,visible:Object.fromEntries(m.layerOrderBackToFront.map(k=>[k,true]))};
const images={}, refs=[], $=id=>document.getElementById(id);
document.querySelectorAll('button,select,input').forEach(el=>el.disabled=true);
function loadImage(src){return new Promise((resolve,reject)=>{const im=new Image;im.onload=()=>resolve(im);im.onerror=reject;im.src=src;});}
function composite(frame=state.frame){const c=document.createElement('canvas');c.width=c.height=256;const ctx=c.getContext('2d');for(const slot of m.layerOrderBackToFront){if(!state.visible[slot])continue;let key=slot==='hands'?slot:`${slot}:${state.selection[slot]}`;if(slot==='body')key=state.selection.hair!=='chestnut'||state.selection.face!=='blue'||!state.visible.hair||!state.visible.face||!state.visible.outfit?'body-filled':'body';ctx.drawImage(images[`${String(frame).padStart(2,'0')}/${key}`],0,0);}return c;}
function stage(canvas,image,withAnchors){const ctx=canvas.getContext('2d');ctx.clearRect(0,0,420,540);ctx.imageSmoothingEnabled=false;ctx.drawImage(image,60,54,140,180,0,0,420,540);if(withAnchors){const f=m.frames[state.frame];for(const [key,color] of [['head','#eed38f'],['rightHand','#a9e5bd'],['leftHand','#a9e5bd']]){const [x,y]=f[key];ctx.beginPath();ctx.arc((x-60)*3,(y-54)*3,5,0,Math.PI*2);ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();}for(const [x,y] of Object.values(f.soleMarkers)){ctx.strokeStyle='#87c4db';ctx.beginPath();ctx.moveTo((x-60)*3-9,(y-54)*3);ctx.lineTo((x-60)*3+9,(y-54)*3);ctx.stroke();}}}
function render(){stage($('reference'),refs[state.frame],false);stage($('character'),composite(),state.anchors);$('play').textContent=state.playing?'暂停':'播放';$('frame-label').textContent=state.frame===0?'00 · 站姿':`${String(state.frame).padStart(2,'0')} / 08`;$('look-name').textContent=(state.selection.hair==='silver'?'银发':'栗发')+(state.selection.outfit==='ranger'?'游侠':'旅人');for(const b of $('timeline').children)b.setAttribute('aria-pressed',String(Number(b.dataset.frame)===state.frame));for(const group of document.querySelectorAll('[data-slot]'))for(const b of group.children)b.setAttribute('aria-pressed',String(state.selection[group.dataset.slot]===b.dataset.value));}
let lastTick=0;
function tick(t){if(state.playing&&t-lastTick>=state.frameMs){state.frame=state.frame%8+1;lastTick=t;render();}requestAnimationFrame(tick);}
function select(slot,value){if(!m.choices[slot]?.includes(value))throw new Error('Unknown appearance');state.selection[slot]=value;render();}
for(const group of document.querySelectorAll('[data-slot]'))for(const b of group.children)b.addEventListener('click',()=>select(group.dataset.slot,b.dataset.value));
for(let f=0;f<9;f++){const b=document.createElement('button');b.textContent=String(f).padStart(2,'0');b.dataset.frame=f;b.setAttribute('aria-label',f===0?'站姿 00':`第 ${f} 帧`);b.addEventListener('click',()=>{state.frame=f;state.playing=false;render();});$('timeline').appendChild(b);}
const names={body:'身体 / 靴子',weapon:'武器',outfit:'衣物',face:'面部',hair:'头发',hands:'前景手部'};
for(const key of m.layerOrderBackToFront){const label=document.createElement('label');label.className='check';const input=document.createElement('input');input.type='checkbox';input.checked=true;input.dataset.layer=key;input.addEventListener('change',()=>{state.visible[key]=input.checked;render();});label.append(input,document.createTextNode(names[key]));$('layer-list').appendChild(label);}
$('play').addEventListener('click',()=>{state.playing=!state.playing;if(state.playing&&state.frame===0)state.frame=1;lastTick=performance.now();render();});
$('speed').addEventListener('change',()=>{state.frameMs=Number($('speed').value);lastTick=performance.now();});
$('anchors').addEventListener('change',()=>{state.anchors=$('anchors').checked;render();});
function download(blob,name){const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function fileKey(){return Object.values(state.selection).join('-');}
$('export-frame').addEventListener('click',()=>composite().toBlob(b=>download(b,`p1-down-${fileKey()}-${String(state.frame).padStart(2,'0')}.png`)));
$('export-atlas').addEventListener('click',()=>{const c=document.createElement('canvas');c.width=2304;c.height=256;const ctx=c.getContext('2d');for(let f=0;f<9;f++)ctx.drawImage(composite(f),f*256,0);c.toBlob(b=>download(b,`p1-down-${fileKey()}-atlas.png`));});
$('export-config').addEventListener('click',()=>download(new Blob([JSON.stringify({schemaVersion:1,template:'P1-Down-v1',direction:'down',selection:state.selection,visibleLayers:state.visible,frameMs:state.frameMs},null,2)],{type:'application/json'}),`p1-down-${fileKey()}.json`));
window.__templateReady=(async()=>{await Promise.all([...Object.entries(data.assets).map(async([k,v])=>images[k]=await loadImage(v)),...data.references.map(async(v,i)=>refs[i]=await loadImage(v))]);document.querySelectorAll('button,select,input').forEach(el=>el.disabled=false);$('loading').textContent='部件已就绪 · 可离线使用';render();requestAnimationFrame(tick);return true;})().catch(error=>{$('loading').textContent='部件加载失败，请重新打开完整的 preview.html。';throw error;});
window.templatePilot={state,select,composite,render,manifest:m};
</script>
</html>
